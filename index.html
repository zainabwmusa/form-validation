<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <link rel="stylesheet" href="style.css">
</head>
<body>

  <form action="#" method="post" class="content">
    <div class="heading">
      <h1>Form Validation</h1>
    </div>

    <div class="input">
      <label for="name">Full Name: </label>
      <input type="text" name="name" id="name" placeholder="Your Full Name" minlength="5">
      <p class="error">Please Enter Your Full Name</p>
    </div>

    <div class="input">
      <label for="username">Username:</label>
      <input type="text" name="username" id="username" placeholder="Your Username" minlength="10">
      <p class="error">Username should be at least more than 10 characters</p>
    </div>

    <div class="input">
      <label for="email">Email:</label>
      <input type="email" name="email" id="email" placeholder="Your Email Address" required>
      <p class="error">Email Address is required</p>
    </div>

    <div class="input">
      <label for="password">Password:</label>
      <input type="text" name="password" id="password" placeholder="Your Password" minlength="8">
      <p class="error">Password should be at least more than 8 characters</p>
    </div>

    <button type="submit">Validate</button>
  </form>
</body>
</html>
